[versions]
kotlin = "2.4.21"
librarian = "0.2.2-SNAPSHOT"
kotlinx-coroutines = "1.11.0"
kable = "0.45.0"
klibnanolog = "1.3.0"
logback = "1.6.6"
kotlinx-io = "0.9.3"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
librarian = { id = "com.gradleup.librarian", version.ref = "librarian" }

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-jdk9 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-jdk9", version.ref = "kotlinx-coroutines" }
klibnanolog = { group = "org.jraf.klibnanolog", name = "klibnanolog", version.ref = "klibnanolog" }
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
kable-core = { group = "com.juul.kable", name = "kable-core", version.ref = "kable" }
kotlinx-io = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinx-io" }
